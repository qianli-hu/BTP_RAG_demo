<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    .box{rx:8;}
    .t{fill:#ffffff;font-size:14px;font-weight:600;text-anchor:middle}
    .s{fill:#e6edf3;font-size:11.5px;text-anchor:middle;opacity:.92}
    .lbl{fill:#8b949e;font-size:11.5px;text-anchor:middle}
    .hdr{fill:#8b949e;font-size:12px;font-weight:700;letter-spacing:.08em}
    .edge{stroke:#8b949e;stroke-width:1.6;fill:none;marker-end:url(#ar)}
  </style>

  <!-- ===================== INGEST ROW ===================== -->
  <text x="30" y="28" class="hdr">INGEST — OFFLINE · DETERMINISTIC · NO LLM</text>

  <rect x="30"  y="44" width="140" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="100" y="68" class="t">SAP Help docs</text>
  <text x="100" y="86" class="s">AI Core · HANA Vector · Launchpad</text>

  <rect x="245" y="44" width="180" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="335" y="68" class="t">corpus/raw · 3 docs</text>
  <text x="335" y="86" class="s">sha-pinned in MANIFEST.json</text>

  <rect x="505" y="44" width="200" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="605" y="68" class="t">1,216 chunks</text>
  <text x="605" y="86" class="s">text + breadcrumbs + ids + hashes</text>

  <rect x="785" y="44" width="160" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="865" y="68" class="t">embeddings</text>
  <text x="865" y="86" class="s">OpenAI · 1536-d</text>

  <path class="edge" d="M170,72 L243,72"/>  <text x="207" y="62" class="lbl">fetch.sh</text>
  <path class="edge" d="M425,72 L503,72"/>  <text x="464" y="62" class="lbl">chunk.py</text>
  <path class="edge" d="M705,72 L783,72"/>  <text x="744" y="62" class="lbl">embed.py</text>
  <path class="edge" d="M865,100 L865,140 L601,140 L601,158"/>

  <!-- ===================== STORE ===================== -->
  <rect x="240" y="160" width="680" height="104" rx="10" fill="none" stroke="#2e9e6b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="580" y="182" class="t" fill="#2e9e6b" font-size="13">VectorStore interface — two-track · swap unit = dense_search only</text>

  <rect x="280" y="196" width="280" height="52" class="box" fill="#2e9e6b" rx="8"/>
  <text x="420" y="218" class="t">SqliteStore</text>
  <text x="420" y="236" class="s">local dev / demo / CI / fallback</text>

  <rect x="600" y="196" width="280" height="52" class="box" fill="#1f7a55" rx="8"/>
  <text x="740" y="218" class="t">HanaStore</text>
  <text x="740" y="236" class="s">SAP HANA Cloud (REAL_VECTOR · cosine)</text>

  <!-- ===================== SERVE + EVAL ===================== -->
  <text x="30" y="312" class="hdr">SERVE + EVAL — ONE SHARED ENGINE (core.ask)</text>

  <rect x="30" y="346" width="90" height="48" class="box" fill="#6e56a6" rx="8"/>
  <text x="75" y="374" class="t">query</text>

  <rect x="150" y="346" width="120" height="48" class="box" fill="#6e56a6" rx="8"/>
  <text x="210" y="368" class="t">embed</text>
  <text x="210" y="384" class="s">query vector</text>

  <rect x="320" y="318" width="180" height="46" class="box" fill="#6e56a6" rx="8"/>
  <text x="410" y="338" class="t">dense top-30</text>
  <text x="410" y="354" class="s">store-owned cosine</text>

  <rect x="320" y="382" width="180" height="46" class="box" fill="#6e56a6" rx="8"/>
  <text x="410" y="402" class="t">BM25 top-30</text>
  <text x="410" y="418" class="s">app-layer (rank_bm25)</text>

  <rect x="552" y="346" width="170" height="48" class="box" fill="#6e56a6" rx="8"/>
  <text x="637" y="368" class="t">RRF fuse + dedup</text>
  <text x="637" y="384" class="s">→ top-5</text>

  <!-- refusal diamond -->
  <polygon points="855,322 950,370 855,418 760,370" fill="#c08a1e"/>
  <text x="855" y="364" class="t">refusal gate</text>
  <text x="855" y="381" class="s">top-cosine ≥ 0.56?</text>

  <path class="edge" d="M120,370 L148,370"/>
  <path class="edge" d="M270,362 L318,344"/>
  <path class="edge" d="M270,378 L318,402"/>
  <path class="edge" d="M500,341 L550,362"/>
  <path class="edge" d="M500,405 L550,380"/>
  <path class="edge" d="M722,370 L758,370"/>
  <!-- store feeds dense -->
  <path class="edge" d="M420,248 L410,316"/>
  <text x="372" y="282" class="lbl">vectors</text>

  <!-- outcomes -->
  <rect x="555" y="470" width="240" height="56" class="box" fill="#2e9e6b" rx="8"/>
  <text x="675" y="492" class="t">gpt-5-mini grounded answer</text>
  <text x="675" y="510" class="s">+ chunk-id citations</text>

  <rect x="855" y="470" width="190" height="56" class="box" fill="#b35454" rx="8"/>
  <text x="950" y="492" class="t">“Not in knowledge base.”</text>
  <text x="950" y="510" class="s">refused · $0 · no LLM call</text>

  <path class="edge" d="M820,412 L700,468"/> <text x="735" y="438" class="lbl">yes</text>
  <path class="edge" d="M905,412 L945,468"/> <text x="943" y="438" class="lbl">no</text>

  <!-- ===================== OUTPUTS ===================== -->
  <rect x="280" y="592" width="280" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="420" y="614" class="t">online: FastAPI /ask</text>
  <text x="420" y="632" class="s">+ Streamlit UI · /health · /docs</text>

  <rect x="620" y="592" width="330" height="56" class="box" fill="#3b6ea5" rx="8"/>
  <text x="785" y="614" class="t">offline: eval harness</text>
  <text x="785" y="632" class="s">rule gates + gpt-5 judge → registry (fingerprint)</text>

  <path class="edge" d="M620,526 L450,590"/>
  <path class="edge" d="M700,526 L765,590"/>
</svg>
