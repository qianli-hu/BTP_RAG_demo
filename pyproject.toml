[project]
name = "btp-rag"
version = "1.0.0"
description = "RAG over SAP BTP documentation — HANA Cloud Vector + hybrid retrieval, grounded answers with citations, adversarial eval harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Qianli Hu" }]

dependencies = [
    # core pipeline
    "openai>=1.50",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "hdbcli>=2.20",
    # parsing / chunking (ingest)
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    # eval
    "tiktoken>=0.7",
]

[project.optional-dependencies]
ingest-tables = ["docling>=2.0"]          # heavy (ML models); only needed for the PDF-table pass
ui = ["streamlit>=1.36"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# this repo is a flat layout of top-level modules + packages
include = ["config.py", "providers.py", "prompts.py", "core.py", "retrieve/", "ingest/", "eval/", "app/"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["chunking"]             # frozen prototype dir — kept as-is for provenance

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]  # errors, pyflakes, warnings, imports, bugbear, modernize
ignore = [
    "E731",   # lambdas are used deliberately for tiny helpers
    "E701", "E702",  # compact one-line statements — deliberate script style in this repo
    "E741",   # `l` for line in tight comprehensions
]

[tool.ruff.lint.per-file-ignores]
# closures defined+called within the same loop iteration (validated output); see chunk_html()
"ingest/chunk.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
