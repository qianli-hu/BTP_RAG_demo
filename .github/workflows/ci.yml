# CI — runs on every PR + push to main. Free, fast, no secrets:
#   lint (ruff) + unit tests (deterministic retrieval/eval machinery + gold-set invariants).
# Corpus-dependent quality gates live in eval.yml (needs OPENAI_API_KEY secret).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev, no heavy ingest extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest
